name: model

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # js/app.js and js/charts.js are browser-only: nothing in the test suite
      # requires them, so until this step existed a syntax error in either one
      # passed every gate and shipped to the published page. `node --check`
      # parses without executing, which is the only way to gate a file that
      # needs a DOM. Cheapest failure in the pipeline, so it runs first.
      - name: Verify every script parses
        run: |
          for f in js/*.js tools/*.js test/*.js; do
            node --check "$f" || { echo "::error file=$f::$f does not parse"; exit 1; }
          done

      - name: Run the model test suite
        run: node test/model.test.js

      # DESIGN.md quotes contrast ratios and calls them the floor a change must
      # not regress. A number in a design document rots the first time somebody
      # nudges a hex, so the arithmetic runs here instead of being asserted
      # there. It also enforces that dark is defined identically in both dark
      # blocks and that no colour is defined only in one of them.
      - name: Verify the palette still clears its stated contrast floor
        run: node tools/check-contrast.js

      # js/charts.js is the other half of the browser-only code, and until this
      # step existed the line above was the whole of its coverage: it parses.
      # The charts need a DOM, but they need very little of one — they build SVG
      # and read almost nothing back — so this renders all eight against a real
      # simulation result through a small shim, and checks what they hand the
      # renderer. It also holds two contracts index.html has with js/app.js that
      # nothing could see across: that the reserved <svg height> matches what
      # gets drawn — it had already drifted 100px — and that every element id
      # the script reaches for exists in the markup.
      - name: Render every chart headlessly
        run: node tools/check-layout.js

      # js/deck.js writes the two exported decks. A deck travels without the
      # page, so a figure it gets wrong has nothing around it to correct it —
      # and every figure on a slide is quoted from the corpus. This asserts
      # each one against a doctored snapshot as well as the real one, so a
      # number hardcoded into slide copy fails rather than quietly going stale.
      # It also checks the PDF's xref, which is byte offsets into the file and
      # so is either exact or unopenable, with nothing in between to spot in
      # review.
      - name: Verify the deck export quotes the corpus and writes valid PDF
        run: node tools/check-deck.js

      # The calibration module is generated from the vendored snapshot. If it
      # drifts from the data it claims to describe, the page is quoting numbers
      # that are not in the corpus any more — so fail the build.
      - name: Verify calibration is reproducible from the snapshot
        run: |
          cp js/calibration.js /tmp/calibration.before.js
          node tools/derive-calibration.js
          diff -q /tmp/calibration.before.js js/calibration.js \
            || { echo "::error::js/calibration.js is stale — run: node tools/derive-calibration.js"; exit 1; }

      - name: Verify the single-file build is current
        run: |
          cp dist/exposure-race.html /tmp/dist.before.html
          node tools/build.js
          diff -q /tmp/dist.before.html dist/exposure-race.html \
            || { echo "::error::dist/exposure-race.html is stale — run: node tools/build.js"; exit 1; }
